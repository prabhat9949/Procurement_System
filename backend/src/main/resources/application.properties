spring.application.name=backend

spring.profiles.active=dev

server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/enterprise_procurement?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Root@1234}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.shutdown=graceful
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
logging.pattern.level=%5p [traceId:%X{traceId:-}]

app.security.jwt.secret=${JWT_SECRET:VGhpcy1pcy1hLWRldmVsb3BtZW50LXNlY3JldC1rZXktbXVzdC1iZS1sb25nLWVub3VnaC0yNTYtYml0cw==}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.three-way-match.quantity-tolerance-percent=${THREE_WAY_MATCH_QUANTITY_TOLERANCE:0}
app.three-way-match.price-tolerance-percent=${THREE_WAY_MATCH_PRICE_TOLERANCE:2}
app.payment.default-currency=${PAYMENT_DEFAULT_CURRENCY:INR}
app.notification.default-expiration-hours=${NOTIFICATION_DEFAULT_EXPIRATION_HOURS:72}
